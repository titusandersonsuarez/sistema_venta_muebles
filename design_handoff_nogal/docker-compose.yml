services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nogal
      POSTGRES_USER: nogal
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - nogal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nogal -d nogal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/NogalApi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=nogal;Username=nogal;Password=changeme"
      Jwt__Issuer: "NogalApi"
      Jwt__Audience: "NogalAdmin"
      Jwt__Key: "CAMBIA_ESTA_LLAVE_POR_UNA_DE_AL_MENOS_32_CARACTERES_LARGA"
      Jwt__ExpireMinutes: "480"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      AdminSeed__NombreUsuario: "admin"
      AdminSeed__Password: "nogal2026"
      AdminSeed__Nombre: "María Bernal"
    ports:
      - "8080:8080"

volumes:
  nogal_db_data:
