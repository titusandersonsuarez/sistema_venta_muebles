server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta desconocida sirve index.html
    # para que React Router maneje el ruteo del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend NogalApi. Nombre del servicio en compose = "api".
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos por el panel (imágenes de productos, etc.)
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
